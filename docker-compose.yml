services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockflow
      POSTGRES_USER: stockflow
      POSTGRES_PASSWORD: stockflow
    ports: ["5432:5432"]
    volumes: ["stockflow_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockflow -d stockflow"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/stockflow
      DB_USER: stockflow
      DB_PASSWORD: stockflow
      JWT_SECRET: ${JWT_SECRET:-bXktc3VwZXItc2VjdXJlLXN0b2NrZmxvdy1qd3Qta2V5LTIwMjY=}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8080/api
    depends_on: [api]
volumes:
  stockflow_data:
